name: Playwright Tests
on:
  push:
    branches: [ main, master, QA ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Selecciona el ambiente para la ejecución de las pruebas'
        required: true
        default: 'QA'
        type: choice
        options:
          - QA
          - Producción
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'QA' }}

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    #- name: Install Playwright Dependencies
     # run: npx playwright install --with-deps
    - name: Create .env file
      run: |
        echo "BASE_URL=${{ secrets.BASE_URL }}" > .env
        echo "TEST_ENV=${{ github.event.inputs.environment || 'QA' }}" >> .env   
    
    - name: Run Playwright tests
      run: npx playwright test "newProduct.spec.ts"
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
